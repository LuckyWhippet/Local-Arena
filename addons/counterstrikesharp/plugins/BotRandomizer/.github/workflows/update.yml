name: Update signatures and database

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Update signatures and database
        run: npm --prefix tools/catalog run update
      - name: Save changes
        run: |
          git add BotRandomizer.cs cosmetic_catalog.json tools/catalog/package.json tools/catalog/package-lock.json
          if git diff --cached --quiet; then
            echo "Signatures and database are already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update signatures and cosmetic database"
          git push
